
<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>株価取込テスト</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .pass {
      color: green;
    }

    .fail {
      color: red;
    }

    pre {
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>株価取込処理テスト</h1>
  <p>Supabaseへの実保存は行いません。</p>
  <div id="results">テスト実行中...</div>

  <script src="stock-import.js"></script>
  <script>
    const results = [];

    function test(name, callback) {
      return Promise.resolve()
        .then(callback)
        .then(() => {
          results.push({
            name,
            pass: true
          });
        })
        .catch(error => {
          results.push({
            name,
            pass: false,
            message: error.message
          });
        });
    }

    async function runTests() {
      const originalClient = window.supabaseClient;
      const calls = [];

      function createFakeClient() {
        return {
          from(table) {
            if (table !== "stock_prices") {
              throw new Error("想定外のテーブルです");
            }

            return {
              upsert(payload, options) {
                calls.push({ payload, options });

                return Promise.resolve({
                  error: null,
                  count: payload.length
                });
              }
            };
          }
        };
      }

      const base = {
        target_date: "2026-10-26",
        close_price: 6550,
        source: "test"
      };

      try {
        window.supabaseClient = createFakeClient();

        await test(
          "複数銘柄をまとめて保存要求できる",
          async () => {
            const result =
              await window.stockImporter.savePrices([
                { ...base, company_id: 1 },
                {
                  ...base,
                  company_id: 2,
                  close_price: 3000
                }
              ]);

            if (calls.length !== 1) {
              throw new Error("保存要求が1回ではありません");
            }

            if (calls[0].payload.length !== 2) {
              throw new Error("2件のデータが送られていません");
            }

            if (result.submitted !== 2) {
              throw new Error("送信件数が一致しません");
            }
          }
        );

        await test(
          "企業IDと日付を重複判定キーに指定する",
          () => {
            const options = calls[0].options;

            if (
              options.onConflict !== "company_id,target_date"
            ) {
              throw new Error("重複判定キーが不正です");
            }

            if (options.ignoreDuplicates !== true) {
              throw new Error("重複データのスキップ設定がありません");
            }
          }
        );

        await test(
          "入力内の同一企業・同一日付を拒否する",
          async () => {
            const callsBefore = calls.length;
            let rejected = false;

            try {
              await window.stockImporter.savePrices([
                { ...base, company_id: 1 },
                { ...base, company_id: 1 }
              ]);
            } catch (error) {
              rejected = true;
            }

            if (!rejected) {
              throw new Error("重複入力が拒否されませんでした");
            }

            if (calls.length !== callsBefore) {
              throw new Error("重複データが保存要求されました");
            }
          }
        );

        await test(
          "不正な終値を拒否する",
          () => {
            let rejected = false;

            try {
              window.stockImporter.validatePrice({
                ...base,
                company_id: 1,
                close_price: 0
              });
            } catch (error) {
              rejected = true;
            }

            if (!rejected) {
              throw new Error("終値0が拒否されませんでした");
            }
          }
        );

      } catch (error) {
        results.push({
          name: "テスト実行",
          pass: false,
          message: error.message
        });
      } finally {
        window.supabaseClient = originalClient;
      }

      const passed =
        results.filter(item => item.pass).length;
      const failed = results.length - passed;

      document.getElementById("results").innerHTML =
        `<h2>${passed}/${results.length} 件成功</h2>` +
        `<p class="${failed ? "fail" : "pass"}">` +
        (
          failed
            ? `${failed} 件失敗`
            : "すべてのテストに成功"
        ) +
        `</p><pre>` +
        results.map(item =>
          `${item.pass ? "PASS" : "FAIL"}：${item.name}` +
          (
            item.message
              ? `（${item.message}）`
              : ""
          )
        ).join("\n") +
        `</pre>`;
    }

    runTests();
  </script>
</body>
</html>
